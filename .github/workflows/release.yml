name: Release

on:
  push:
    branches:
      - main
      - staging
  release:
    types:
      - published

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: '@calan-co/doc-vader'
  REGISTRY_URL: https://npm.pkg.github.com
  NODE_VERSION: '22'
  STABLE_BRANCH: main

jobs:
  version:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-package-version.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      package-name: '@calan-co/doc-vader'
      registry-url: https://npm.pkg.github.com
      node-version: '22'

  publish-staging-prerelease:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-package-staging.yml@v1
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      package-name: '@calan-co/doc-vader'
      registry-url: https://npm.pkg.github.com
      node-version: '22'

  publish-release:
    if: github.event_name == 'release'
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-package-stable-release.yml@v1
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      package-name: '@calan-co/doc-vader'
      registry-url: https://npm.pkg.github.com
      node-version: '22'
      stable-branch: main
      release-tag: ${{ github.event.release.tag_name }}
      release-prerelease: ${{ github.event.release.prerelease }}
