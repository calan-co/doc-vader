name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  work-item-merge-gate:
    name: Work-item merge gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run backlog:validate:pr
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOC_VADER_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          DOC_VADER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOC_VADER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  ci:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-package-ci.yml@v1
    with:
      node-version: '22'
      working-directory: .
      install-command: pnpm install --frozen-lockfile
      lint-command: pnpm run lint
      typecheck-command: pnpm exec tsc --noEmit
      docs-command: pnpm run docs:lint
      backlog-command: pnpm run backlog:validate:ci
      test-command: pnpm run build && pnpm run test -- --run
      build-command: pnpm run build
      test-matrix-node-versions: '["22", "24"]'
      test-matrix-os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      changeset-exempt-path-prefixes: 'docs/ backlog/ README.md CHANGELOG.md LICENSE .github/ .doc-vader/ AGENTS.md'
      require-changeset: true
      enable-lint: true
      enable-type-check: true
      enable-backlog-check: true
      enable-docs-check: false
      enable-tests: true
      enable-build: true
      enable-changeset-check: true
    secrets: inherit
