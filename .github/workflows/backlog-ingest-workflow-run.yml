name: Backlog – Ingest Workflow Run

on:
  workflow_call:
    inputs:
      consumer-config:
        description: 'Path to the backlog consumer config file'
        type: string
        default: '.doc-vader/backlog-consumer.json'
      doc-vader-version:
        description: 'Version of @calan-co/doc-vader to install (e.g. "latest", "0.1.0")'
        type: string
        default: 'latest'
      commit-user-name:
        description: 'Git user name for automated backlog commits'
        type: string
        default: 'doc-vader[bot]'
      commit-user-email:
        description: 'Git user email for automated backlog commits'
        type: string
        default: '0+doc-vader[bot]@users.noreply.github.com'
    secrets:
      packages-read-token:
        description: >
          Token with read:packages scope for the GitHub Package Registry.
          Defaults to the calling workflow's GITHUB_TOKEN when not supplied
          (suitable for same-organisation repositories).
        required: false

jobs:
  ingest:
    name: Ingest Workflow Run Event
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com

      - name: Install doc-vader
        run: npm install -g @calan-co/doc-vader@${{ inputs.doc-vader-version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.packages-read-token || secrets.GITHUB_TOKEN }}

      - name: Ingest workflow run event
        run: |
          doc-vader backlog ingest-event \
            --provider github \
            --event "workflow_run.completed" \
            --payload "$GITHUB_EVENT_PATH" \
            --consumer-config "${{ inputs.consumer-config }}"

      - name: Commit backlog changes
        run: |
          if [ -z "$(git status --porcelain -- backlog .doc-vader)" ]; then
            exit 0
          fi
          git config user.name "${{ inputs.commit-user-name }}"
          git config user.email "${{ inputs.commit-user-email }}"
          git add backlog .doc-vader
          git commit -m "chore(backlog): ingest workflow run event"
          git push
