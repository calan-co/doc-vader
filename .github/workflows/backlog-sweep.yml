name: Backlog – Sweep

on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Preview eligible updates without writing changes'
        type: boolean
        default: false
      consumer-config:
        description: 'Path to the backlog consumer config file'
        type: string
        default: '.doc-vader/backlog-consumer.json'
      backlog-dir:
        description: 'Directory containing backlog work-item Markdown files'
        type: string
        default: 'backlog'
      doc-vader-version:
        description: 'Version of @calan-co/doc-vader to install (e.g. "latest", "next", "0.1.0")'
        type: string
        default: 'latest'
      commit-user-name:
        description: 'Git user name for automated backlog commits'
        type: string
        default: 'doc-vader[bot]'
      commit-user-email:
        description: 'Git user email for automated backlog commits'
        type: string
        default: '0+doc-vader[bot]@users.noreply.github.com'
      app-id:
        description: >
          GitHub App ID for the doc-vader app.
          When provided alongside app-private-key, commits are made as doc-vader[bot]
          and can bypass protected-branch ruleset restrictions.
        type: string
        default: ''
    secrets:
      packages-read-token:
        description: >
          Token with read:packages scope for the GitHub Package Registry.
          Defaults to the calling workflow's GITHUB_TOKEN when not supplied
          (suitable for same-organisation repositories).
        required: false
      app-private-key:
        description: >
          GitHub App private key (PEM) for the doc-vader app.
          Required when app-id is provided.
        required: false

jobs:
  sweep:
    name: Sweep Eligible Work Items
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Generate doc-vader app token
        id: app-token
        if: ${{ inputs.app-id != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@calan-co'

      - name: Install doc-vader
        run: npm install -g @calan-co/doc-vader@${{ inputs.doc-vader-version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.packages-read-token || secrets.GITHUB_TOKEN }}

      - name: Run backlog scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
          BACKLOG_DIR: ${{ inputs.backlog-dir }}
          CONSUMER_CONFIG: ${{ inputs.consumer-config }}
        run: |
          set -euo pipefail

          cmd=(
            doc-vader
            backlog scan
            --dir "$BACKLOG_DIR"
            --consumer-config "$CONSUMER_CONFIG"
            --generate-evidence
            --validate-archive-candidates
            --report-format json
            --output-file /tmp/scan-report.json
          )

          if [[ "${DRY_RUN}" == "true" ]]; then
            cmd+=(--dry-run)
          fi

          "${cmd[@]}"

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: backlog-scan-report-${{ github.run_id }}
          path: /tmp/scan-report.json
          if-no-files-found: error

      - name: Commit sweep changes
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -z "$(git status --porcelain -- ${{ inputs.backlog-dir }} .doc-vader)" ]; then
            echo "No backlog changes to commit."
            exit 0
          fi

          base_branch="${{ github.ref_name }}"
          automation_branch="automation/backlog-sweep-${base_branch}"

          git config user.name "${{ inputs.commit-user-name }}"
          git config user.email "${{ inputs.commit-user-email }}"
          git add ${{ inputs.backlog-dir }} .doc-vader
          git commit -m "chore(backlog): sweep eligible work item updates"

          # Protected branches require PR-based updates; push to automation branch.
          git push --force-with-lease origin HEAD:${automation_branch}

          existing_pr="$(gh pr list --base "$base_branch" --head "$automation_branch" --state open --json number --jq '.[0].number')"
          pr_title="chore(backlog): sweep eligible work item updates"

          pr_body_file="$(mktemp)"
          printf '%s\n\n- Source workflow: %s\n- Run ID: %s\n- Base branch: %s\n' \
            'Automated backlog sweep updates generated by Backlog Automation workflow.' \
            "$GITHUB_WORKFLOW" \
            "$GITHUB_RUN_ID" \
            "$base_branch" > "$pr_body_file"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$pr_title" --body-file "$pr_body_file"
            echo "Updated existing sweep PR #$existing_pr"
          else
            gh pr create \
              --base "$base_branch" \
              --head "$automation_branch" \
              --title "$pr_title" \
              --body-file "$pr_body_file"
            echo "Created new sweep PR from ${automation_branch} to ${base_branch}"
          fi
